# Staging profile - local-staging run (uses local MySQL on Windows)
# Activated with: -Dspring-boot.run.profiles=local-staging
# DB: hospital_scheduler_stg (root/123456)
# Runs init.sql automatically via Spring Boot at first start

spring.application.name=hospital-scheduler

# Database - local MySQL on Windows
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hospital_scheduler_stg}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP - smaller pool for local-staging
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=${SERVER_PORT:8080}
# Force JVM + Jackson timezone to Asia/Ho_Chi_Minh so date comparisons are deterministic.
spring.jackson.time-zone=Asia/Ho_Chi_Minh
user.timezone=Asia/Ho_Chi_Minh

# JWT
jwt.secret=${JWT_SECRET:Ym9va2NhbXBzZWNyZXRrZXlmb3Jqd3R0b2tlbndpdGhBdExlYXN0MzJjaGFycw==}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Auth Cookie (false for local dev over http)
app.auth.cookie-secure=false
app.auth.cookie-same-site=Lax

# SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Email - disabled in local-staging
app.email.enabled=false
app.email.from=noreply@hospital-scheduler.local
app.email.conflict-notification.enabled=false
management.health.mail.enabled=false

# Logging
logging.level.com.hospital.scheduler=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
