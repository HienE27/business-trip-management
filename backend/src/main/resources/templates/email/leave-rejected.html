<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/base :: layout(~{::#content})}">
<head>
  <title>Yêu cầu nghỉ phép bị từ chối</title>
</head>
<body>
  <div id="content" th:fragment="layout">
    <p>Kính gửi <strong th:text="${staffName}">Nhân viên</strong>,</p>

    <p>Yêu cầu nghỉ phép từ <span th:text="${startDate}">01/07</span> đến <span th:text="${endDate}">03/07</span> đã bị <strong style="color: #ba1a1a;">TỪ CHỐI</strong> bởi <span th:text="${reviewerName}">Quản lý</span>.</p>

    <th:block th:if="${reviewNote != null and reviewNote != ''}">
      <div class="alert">
        <div class="alert-title">Lý do:</div>
        <span th:text="${reviewNote}">Ghi chú</span>
      </div>
    </th:block>

    <p>Nếu cần thiết, bạn có thể gửi yêu cầu nghỉ phép mới trên hệ thống.</p>
  </div>
</body>
</html>
