# Spring Boot
spring.application.name=hospital-scheduler

# Database - uses environment variables with defaults for local dev
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hospital_scheduler}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool - timeouts tuned for long-running auto-scheduling operations
spring.datasource.hikari.connection-timeout=120000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20

# JPA
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.open-in-view=false

# Server
server.port=${SERVER_PORT:8080}

# JWT - MUST be overridden in production via environment variable
jwt.secret=${JWT_SECRET:Ym9va2NhbXBzZWNyZXRrZXlmb3Jqd3R0b2tlbndpdGhBdExlYXN0MzJjaGFycw==}
jwt.expiration=${JWT_EXPIRATION:86400000}

# App auth cookie
app.auth.cookie-secure=${COOKIE_SECURE:false}
app.auth.cookie-same-site=Lax

# SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# File Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.hospital.scheduler=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}

# Hibernate Batch Configuration
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Actuator - always show health details so /actuator/health surfaces which
# component (db, disk, etc.) is DOWN instead of an empty 503 body.
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoints.web.exposure.include=health
# Disable mail health indicator — app.email.enabled defaults to false in
# local dev, so the SMTP probe is a false-negative that drags overall
# status to DOWN. Mail is exercised only when the feature is on.
management.health.mail.enabled=false

# Email Configuration (override via environment variables in production)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# App email settings
app.email.enabled=${APP_EMAIL_ENABLED:false}
app.email.from=${APP_EMAIL_FROM:noreply@hospital-scheduler.com}
app.email.conflict-notification.enabled=${APP_EMAIL_CONFLICT_ENABLED:false}
