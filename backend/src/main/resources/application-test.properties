# Test profile using MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_scheduler?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Server
server.port=8080

# Disable email
spring.mail.host=localhost
spring.mail.port=25
app.email.enabled=false

# Disable DataSeeder
app.data.seeder.enabled=false

# Logging
logging.level.com.hospital.scheduler=INFO
logging.level.org.hibernate.SQL=WARN

# Actuator
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info,metrics

# JWT
jwt.secret=dGVzdHNlY3JldGtleWZvcihkZXYpYW5kdW5pdHRlc3RzdGVzdHNlY3JldGtleWZvcihkZXYpYW5kdW5pdHRlc3RzdGVzdHNlY3JldA==
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001
