name: Frontend CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.actor }}/hospital-scheduler-frontend

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./frontend

      - name: Build
        run: pnpm build
        working-directory: ./frontend

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/.next
            frontend/public
          retention-days: 5

  test:
    name: Test (Lint & Type Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./frontend

      - name: Run linter
        run: pnpm lint
        working-directory: ./frontend

      - name: Type check
        run: pnpm tsc --noEmit
        working-directory: ./frontend

  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./frontend

      - name: Run unit tests
        run: pnpm test
        working-directory: ./frontend

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    env:
      # Credentials for the dev backend the suite hits.
      # Override per-environment via repository secrets. When
      # unset, the fixture falls back to the placeholder
      # 'admin' / 'change-me' so the suite still runs in
      # environments without a real backend (the loginAs helper
      # is a no-op if no login form is rendered).
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_LOGIN_PATH: ${{ vars.E2E_LOGIN_PATH || '/login' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./frontend

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ./frontend

      - name: Build production bundle
        run: pnpm build
        working-directory: ./frontend

      - name: Run Playwright tests
        run: pnpm test:e2e
        working-directory: ./frontend

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 5

  accessibility:
    name: Accessibility (axe-core)
    runs-on: ubuntu-latest
    env:
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_LOGIN_PATH: ${{ vars.E2E_LOGIN_PATH || '/login' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./frontend

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: ./frontend

      - name: Build production bundle
        run: pnpm build
        working-directory: ./frontend

      - name: Run axe-core accessibility scan
        run: pnpm exec playwright test tests/e2e/accessibility.spec.ts --project=chromium
        working-directory: ./frontend

  docker-build:
    name: Docker Build & Push
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Echo deploy info
        run: |
          echo "Docker image built and pushed successfully!"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo ""
          echo "Deploy step is commented out - no server configured."
          echo "To enable deployment, configure SSH credentials in repository secrets"
          echo "and uncomment the deploy steps below."
          echo ""
          echo "# SSH_DEPLOY_HOST=\${{ secrets.SSH_DEPLOY_HOST }}"
          echo "# SSH_DEPLOY_USER=\${{ secrets.SSH_DEPLOY_USER }}"
          echo "# SSH_DEPLOY_KEY=\${{ secrets.SSH_DEPLOY_KEY }}"
          echo ""
          echo "# Deploy commands would be:"
          echo "# docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "# docker stop hospital-scheduler-frontend || true"
          echo "# docker run -d --name hospital-scheduler-frontend \\"
          echo "#   --restart unless-stopped \\"
          echo "#   -p 3000:3000 \\"
          echo "#   ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      # Uncomment the following steps when server is configured:
      # - name: Deploy to server via SSH
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.SSH_DEPLOY_HOST }}
      #     username: ${{ secrets.SSH_DEPLOY_USER }}
      #     key: ${{ secrets.SSH_DEPLOY_KEY }}
      #     script: |
      #       docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      #       docker stop hospital-scheduler-frontend || true
      #       docker rm hospital-scheduler-frontend || true
      #       docker run -d \
      #         --name hospital-scheduler-frontend \
      #         --restart unless-stopped \
      #         -p 3000:3000 \
      #         -e NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
      #         ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
