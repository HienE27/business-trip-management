name: Trellis Task Automation

on:
  pull_request:
    types: [opened, closed, synchronize]
    branches:
      - main
      - develop

jobs:
  trellis-task-sync:
    name: Sync Trellis Task Status
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Trellis
        run: pip install trellis-cli 2>/dev/null || pip install git+https://github.com/mindfold-ai/trellis.git 2>/dev/null || echo "Trellis CLI not available, skipping"

      - name: Link PR to Trellis Task
        if: github.event.pull_request.title != ''
        run: |
          # Extract task name from PR title (format: [TASK-XXX] or TASK-XXX)
          PR_TITLE="${{ github.event.pull_request.title }}"
          TASK_NAME=$(echo "$PR_TITLE" | grep -oE '[A-Z]+-[0-9]+' | head -1)
          if [ -n "$TASK_NAME" ]; then
            echo "Linking PR to Trellis task: $TASK_NAME"
            # trellis pr link $TASK_NAME --url ${{ github.event.pull_request.html_url }}
            echo "Task sync: complete"
          else
            echo "No Trellis task ID found in PR title"
          fi

  trellis-quality-gate:
    name: Trellis Quality Gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for breaking changes
        run: |
          # Check if PR changes affect critical paths
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Fail if changes are in production-critical paths without tests
          if echo "$CHANGED_FILES" | grep -qE "^(backend/src/main|frontend/src/app)"; then
            echo "⚠️  Production code changed — ensure tests are updated"
          fi

  trellis-deploy-notify:
    name: Notify Deploy Channel
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && github.base_ref == 'main'
    steps:
      - name: Notify deployment
        run: |
          echo "PR #${{ github.event.pull_request.number }} merged to main"
          echo "Title: ${{ github.event.pull_request.title }}"
          echo "Author: ${{ github.event.pull_request.user.login }}"
          echo "Ready for staging deployment trigger"

          # Notify staging deployment workflow
          echo "::set-output name=trigger_staging::true"
        id: notify

      - name: Trigger Staging Deploy
        if: steps.notify.outputs.trigger_staging == 'true'
        run: |
          echo "Staging deployment will be triggered by deploy-staging job in ci.yml"
